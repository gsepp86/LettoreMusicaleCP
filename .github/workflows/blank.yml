name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: lettore-musicale-windows
          path: target/release/lettore-musicale.exe

      # Se esiste una release per la versione in Cargo.toml, allega
      # l'eseguibile (installabile) al suo interno.
      - name: Attach exe to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ASSET="LettoreMusicaleCP-${VERSION}.exe"
          mkdir -p dist
          cp target/release/lettore-musicale.exe "dist/${ASSET}"
          for TAG in "v${VERSION}" "v${VERSION%.0}"; do
            if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "$TAG" "dist/${ASSET}" --repo "${GITHUB_REPOSITORY}" --clobber
              echo "Allegato ${ASSET} alla release ${TAG}"
              exit 0
            fi
          done
          echo "Nessuna release trovata per la versione ${VERSION}: eseguibile caricato solo come artifact."
